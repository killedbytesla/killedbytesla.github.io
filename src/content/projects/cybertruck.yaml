description: "The stainless-steel pickup, with a Texas production wind-down announced for mid-2027."
details: "On November 6, 2026, Reuters reported that Tesla plans to wind down Cybertruck production at Gigafactory Texas around mid-2027 to make room for Cybercab. The report says it remains unclear whether production will move elsewhere or end entirely. This is an announced factory wind-down, not a completed global discontinuation."
dateNote: "Start is the first customer-delivery month. Mid-2027 is an approximate target, not a confirmed final production date."
