description: "The solar installer acquired by Tesla and integrated into its energy business."
details: "SolarCity was founded independently in 2006 and acquired by Tesla in November 2016. This is an acquired and absorbed business, not a project Tesla founded or a claim that all of its solar operations closed. It is excluded from the ended-project count."
dateNote: "Dates cover the independent company through Tesla\u2019s acquisition, not the end of solar installations."
